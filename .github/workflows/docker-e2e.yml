name: Docker E2E

on:
  push:
    branches: [master, performance]
  pull_request:
    branches: [master, performance]
  schedule:
    - cron: '30 0 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        protocol: [udp, tcp]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build image under test
        run: docker build --pull --tag openvpn:e2e .
      - name: Test VPN connection and tunnel traffic
        env:
          PROTOCOL: ${{ matrix.protocol }}
          E2E_LOG_DIR: ${{ runner.temp }}/openvpn-e2e-logs
        run: bash test/e2e.sh openvpn:e2e "$PROTOCOL"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-e2e-${{ matrix.protocol }}
          path: ${{ runner.temp }}/openvpn-e2e-logs
          if-no-files-found: ignore
          retention-days: 7
